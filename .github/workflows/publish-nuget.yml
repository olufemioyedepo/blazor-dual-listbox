name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # required for NuGet trusted publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget   # must match the trusted-publishing policy on nuget.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: Test
        run: dotnet test src/BlazorDualListbox.slnx -c Release

      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Packing version $VERSION"
          dotnet pack src/BlazorDualListbox/BlazorDualListbox.csproj \
            -c Release \
            -o artifacts \
            -p:Version="$VERSION"

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: Feminator

      - name: Push
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
