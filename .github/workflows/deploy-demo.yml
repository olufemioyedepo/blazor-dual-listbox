name: Deploy demo to GitHub Pages

on:
  push:
    branches: [ master ]
    paths:
      - 'src/BlazorDualListbox/**'
      - 'src/BlazorDualListbox.DemoWasm/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PROJECT: src/BlazorDualListbox.DemoWasm/BlazorDualListbox.DemoWasm.csproj
  # Must match the repository name — it's the URL sub-path on github.io.
  BASE_HREF: /blazor-dual-listbox/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (Blazor WebAssembly)
        run: dotnet publish "$PROJECT" -c Release -o publish

      - name: Rewrite base href for the Pages sub-path
        run: |
          sed -i 's|<base href="/" />|<base href="'"$BASE_HREF"'" />|g' publish/wwwroot/index.html

      - name: SPA fallback + disable Jekyll
        run: |
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
